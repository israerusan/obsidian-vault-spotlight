<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Vault Spotlight hero</title>
  <desc id="desc">A dark-themed product illustration showing Search, Workflows, and Actions inside a keyboard-first Obsidian launcher.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#151f36"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#182235"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="720" rx="32" fill="url(#bg)"/>
  <circle cx="1180" cy="96" r="160" fill="#8b5cf6" opacity="0.08"/>
  <circle cx="130" cy="610" r="180" fill="#22c55e" opacity="0.07"/>

  <text x="88" y="116" fill="#e5eefc" font-size="54" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">Vault Spotlight</text>
  <text x="88" y="162" fill="#a9bbd7" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif">Find notes fast. Reopen recurring work. Act without leaving the keyboard.</text>

  <g filter="url(#shadow)">
    <rect x="84" y="214" width="1112" height="420" rx="26" fill="url(#panel)" stroke="#2a3954"/>
    <rect x="118" y="246" width="1044" height="58" rx="16" fill="#0f172a" stroke="#31415f"/>
    <circle cx="150" cy="275" r="10" fill="#64748b"/>
    <text x="176" y="282" fill="#dce7f7" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif">launch plan</text>
    <rect x="976" y="258" width="152" height="32" rx="12" fill="#1f2b43"/>
    <text x="1007" y="280" fill="#c8d5ea" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif">Files</text>

    <rect x="118" y="330" width="540" height="272" rx="20" fill="#0f172a" stroke="#263449"/>
    <rect x="686" y="330" width="476" height="272" rx="20" fill="#0f172a" stroke="#263449"/>

    <rect x="140" y="360" width="496" height="56" rx="14" fill="#18243a" stroke="#3a4c6b"/>
    <rect x="140" y="360" width="6" height="56" rx="3" fill="#8b5cf6"/>
    <text x="166" y="386" fill="#f8fbff" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">Projects/Roadmap.md</text>
    <text x="166" y="406" fill="#9eb0cc" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif">Alias match · Recent · 2 days ago</text>

    <text x="150" y="452" fill="#dce7f7" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif">Search</text>
    <text x="150" y="480" fill="#9eb0cc" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif">Fuzzy files, commands, headings, links, folders, and open editors.</text>

    <text x="150" y="528" fill="#dce7f7" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif">Workflows</text>
    <text x="150" y="556" fill="#9eb0cc" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif">Save repeated searches like Meeting notes, Follow-ups, or Weekly review.</text>

    <text x="150" y="604" fill="#dce7f7" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif">Actions</text>
    <text x="150" y="632" fill="#9eb0cc" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif">Open, copy, rename, batch edit, export, or preview results in place.</text>

    <text x="714" y="368" fill="#dce7f7" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">Preview</text>
    <text x="714" y="398" fill="#9eb0cc" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif">Launch plan</text>
    <rect x="714" y="426" width="420" height="1" fill="#2f405f"/>
    <text x="714" y="466" fill="#e5eefc" font-size="17" font-family="Inter, Segoe UI, Arial, sans-serif">- finalize pricing page</text>
    <text x="714" y="500" fill="#e5eefc" font-size="17" font-family="Inter, Segoe UI, Arial, sans-serif">- send follow-up notes</text>
    <text x="714" y="534" fill="#e5eefc" font-size="17" font-family="Inter, Segoe UI, Arial, sans-serif">- export project links for handoff</text>

    <rect x="714" y="562" width="150" height="32" rx="12" fill="#1f2b43"/>
    <text x="745" y="583" fill="#d8e3f4" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif">Cmd/Ctrl+K</text>
    <rect x="880" y="562" width="122" height="32" rx="12" fill="#1f2b43"/>
    <text x="908" y="583" fill="#d8e3f4" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif">Actions</text>
  </g>

  <rect x="88" y="662" width="350" height="10" rx="5" fill="url(#accent)"/>
</svg>